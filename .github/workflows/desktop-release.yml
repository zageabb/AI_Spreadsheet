name: Desktop release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1
          libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-xkb1
          libxcb-util1 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build package
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Spreadsheet-${{ runner.os }}
          path: |
            dist/AI-Spreadsheet.zip
            dist/AI-Spreadsheet.zip.sha256
